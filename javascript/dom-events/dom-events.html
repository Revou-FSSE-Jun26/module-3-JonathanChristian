<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="dom-events.css">
</head>
<body>
    <header class="site-header">
        <h1>To-Do List</h1>
        <p class="subtitle">
            List down your tasks here.
        </p>
    </header>

    <main class="container">
        <section class="panel" aria-labelledby="todo-title">
            <h2 id="todo-title" class="visually-hidden" hidden>Task manager</h2>
            <form id="task-form" class="task-form">
                <div class="field">
                    <label for="task-input">New task</label>
                    <input
                        type="text"
                        id="task-input"
                        name="task"
                        placeholder="e.g. Finish array exercise"
                        autocomplete="off"
                    >
                </div>
                <button type="submit">Add</button>
            </form>


            <div class="toolbar">
                <span id="task-count">0 tasks left</span>
                <button type="button" id="clear-completed" class="clear-btn">
                    Clear completed
                </button>
            </div>

            <ul id="task-list" class="task-list"></ul>

            <p id="empty-state" class="empty-state">No tasks yet. Add one above.</p>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; Jonathan 2026</p>
    </footer>

    <script src="dom-events.js"></script>
</body>
</html>
