<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders & Sales</title>
    <link rel="stylesheet" href="array-processing.css">
</head>
<body>
    <header class="site-header">
        <h1>Orders &amp; Sales Dashboard</h1>
        <p class="subtitle">
            Daily summary of orders and sales.
        </p>
    </header>

    <main class="container">
        <section class="panel" aria-labelledby="all-orders-title">
            <h2 id="all-orders-title">All Orders</h2>
            <ul id="all-orders" class="order-list"></ul>
        </section>

        <section class="panel" aria-labelledby="order-totals-title">
            <h2 id="order-totals-title">Order Totals</h2>
            <ul id="order-totals" class="order-list"></ul>
        </section>

        <section class="panel" aria-labelledby="filtered-orders-title">
            <h2 id="filtered-orders-title">High-Value Orders</h2>
            <ul id="filtered-orders" class="order-list"></ul>
        </section>

        <section class="panel summary" aria-labelledby="summary-title">
            <h2 id="summary-title">Sales Summary</h2>
            <div id="sales-summary" class="summary-grid"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; Jonathan 2026</p>
    </footer>

    <script src="array-processing.js"></script>
</body>
</html>
