<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevoShop: Product Catalog</title>
    <link rel="stylesheet" href="../dist/output.css">
    <script type="module" src="../dist/script.js"></script>
</head>
<body>
    <div class="min-h-screen bg-gray-50 p-4 md:p-6">

        <header class="max-w-6xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 px-6 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6 sticky top-4 z-10">
            <h1 class="text-xl md:text-2xl font-bold text-gray-900">RevoShop</h1>
            <div class="relative w-full md:w-80">
                <svg class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
                </svg>
                <input id="search" type="text" placeholder="Search products..."
                    class="w-full pl-9 pr-4 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-700 placeholder-gray-400 focus:ring-2 focus:ring-green-500 focus:bg-white outline-none" />
            </div>
        </header>

        <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">

            <div id="grid" class="lg:col-span-3 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6"></div>

            <aside class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 h-fit lg:sticky lg:top-24">
                <h2 class="text-lg font-bold text-gray-900 border-b border-gray-100 pb-3">Cart Summary</h2>
                <p class="mt-4 flex items-center justify-between text-gray-500">Items: <span id="cart-count" class="font-semibold text-gray-900">0 items</span></p>
                <p class="mt-2 flex items-center justify-between text-gray-500">Total: <span id="cart-total" class="font-bold text-green-600">Rp 0</span></p>
            </aside>

        </div>
    </div>
</body>
</html>
